name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  # Reused by release.yml so tags cannot publish without passing CI
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # shared -> mod-source-modrinth -> cli/api/console (topological order)
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      # e2e needs live api/console; it runs in e2e.yml
      - run: pnpm -r --filter '!e2e' test
      - run: pnpm --filter e2e test:unit
      # the cli tarball ships docker/bluemap/Dockerfile and no scripts/ (#648, #736)
      - run: pnpm --filter @minecraft-docker/mcctl run --if-present verify:package

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [platform, platform/services/cli/templates]
    steps:
      - uses: actions/checkout@v4
      # servers/compose.yml is generated by `mcctl init`; stub it for validation
      - name: Validate ${{ matrix.dir }}/docker-compose.yml
        working-directory: ${{ matrix.dir }}
        env:
          PLAYIT_SECRET_KEY: ci
        run: |
          [ -f servers/compose.yml ] || echo 'services: {}' > servers/compose.yml
          docker compose config -q

  # #651: platform/services/cli/templates/ is the single template source
  templates:
    name: template drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @minecraft-docker/mcctl check:templates
      - run: node --test platform/services/cli/tools/check-templates.test.mjs

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  # Reused by release.yml so tags cannot publish without passing CI
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # shared -> mod-source-modrinth -> cli/api/console (topological order)
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      # e2e needs live api/console; it runs in e2e.yml
      - run: pnpm -r --filter '!e2e' test
      # drift check between platform/scripts and the cli package (#648)
      - run: pnpm --filter @minecraft-docker/mcctl run --if-present verify:package

  scripts:
    name: script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install shellcheck; else sudo apt-get install -y shellcheck; fi
          fi
      - run: pnpm install --frozen-lockfile
      # test:scripts / lint:scripts are added by #647
      - run: pnpm run --if-present test:scripts
      - run: pnpm run --if-present lint:scripts

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [platform, templates]
    steps:
      - uses: actions/checkout@v4
      # servers/compose.yml is generated by `mcctl init`; stub it for validation
      - name: Validate ${{ matrix.dir }}/docker-compose.yml
        working-directory: ${{ matrix.dir }}
        env:
          PLAYIT_SECRET_KEY: ci
        run: |
          [ -f servers/compose.yml ] || echo 'services: {}' > servers/compose.yml
          docker compose config -q
